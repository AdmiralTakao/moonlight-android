name: Build APK (GFN fork)
permissions:
  contents: read

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # The same signing key must be used for every build, otherwise Android
      # refuses to install an update over the previous version.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gfn-signing-key-v1

      - name: Create signing key (first run only)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRootRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-GFN-APK-${{ github.sha }}
          path: app/build/outputs/apk/nonRoot/release/*.apk
          if-no-files-found: error
